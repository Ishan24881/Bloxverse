<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BloxVerse - 3D Obby Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0b0d14;
            color: #f8fafc;
            overflow: hidden;
            overscroll-behavior: none;
        }
        .blox-font {
            font-family: 'Fredoka', sans-serif;
        }
        /* Compact Scrollbars for Landscape Mobile */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(17, 20, 32, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        /* Horizontal Snap Scrolling */
        .snap-x-mandatory {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .snap-center-card {
            scroll-snap-align: center;
        }
        .btn-play {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 0 #047857;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .btn-play:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #047857;
        }
        .arcade-jump-btn {
            background: radial-gradient(circle at 35% 30%, #34d399, #059669);
            box-shadow: 0 6px 0 #064e3b, 0 10px 25px rgba(16, 185, 129, 0.45);
            transition: transform 0.06s ease, box-shadow 0.06s ease;
        }
        .arcade-jump-btn.pressed, .arcade-jump-btn:active {
            transform: scale(0.92) translateY(4px);
            box-shadow: 0 2px 0 #064e3b, 0 4px 12px rgba(16, 185, 129, 0.6);
            background: radial-gradient(circle at 35% 30%, #6ee7b7, #10b981);
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        @keyframes phoneRotateAnim {
            0%, 15% { transform: rotate(0deg); }
            50%, 85% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }
        .rotate-phone-icon {
            animation: phoneRotateAnim 2.6s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-[#0b0d14] select-none">
